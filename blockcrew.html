<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockCrew – Build &amp; Material Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--pn:#111113;--p2:#18181b;--bd:#27272a;--tx:#fafafa;--mu:#a1a1aa;--ac:#4ade80;--e:#4ade80;--m:#fbbf24;--h:#a78bfa;--bt:#fafafa;--bx:#09090b;--rd:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f5;--pn:#fff;--p2:#f4f4f5;--bd:#e4e4e7;--tx:#18181b;--mu:#71717a;--ac:#16a34a;--e:#16a34a;--m:#d97706;--h:#7c3aed;--bt:#18181b;--bx:#fff;--rd:#dc2626}}
:root[data-theme="light"]{--bg:#f4f4f5;--pn:#fff;--p2:#f4f4f5;--bd:#e4e4e7;--tx:#18181b;--mu:#71717a;--ac:#16a34a;--e:#16a34a;--m:#d97706;--h:#7c3aed;--bt:#18181b;--bx:#fff;--rd:#dc2626}
:root[data-theme="dark"]{--bg:#09090b;--pn:#111113;--p2:#18181b;--bd:#27272a;--tx:#fafafa;--mu:#a1a1aa;--ac:#4ade80;--e:#4ade80;--m:#fbbf24;--h:#a78bfa;--bt:#fafafa;--bx:#09090b;--rd:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit;color:var(--tx)}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
aside{border-right:1px solid var(--bd);background:var(--pn);padding:14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;padding:4px 6px 12px}
.cube{width:22px;height:22px;border-radius:5px;background:linear-gradient(var(--ac) 0 35%,#7a5232 35%);box-shadow:inset 0 0 0 1px #0004,inset -3px -3px #0003;flex:none}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:14px 8px 4px}
.nv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--mu)}
.nv:hover{background:var(--p2);color:var(--tx)}.nv.on{background:var(--p2);color:var(--tx)}
.btn{cursor:pointer;border:1px solid var(--bd);background:var(--p2);border-radius:8px;padding:7px 12px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--mu)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--bt);color:var(--bx);border-color:var(--bt)}
.btn.d{color:var(--rd);padding:5px 9px}
main{padding:28px;max-width:1080px;width:100%}
.top{display:none}
h1{font-size:20px;margin:0 0 4px;font-weight:600}.sub{color:var(--mu);margin-bottom:20px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600}.card .sub{margin-bottom:12px;font-size:13px}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.gc{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.stat{font-size:26px;font-weight:600}.stat small{font-size:12px;color:var(--mu);display:block;font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.fm{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
input,select{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.fm input[type=text]{flex:1 1 150px}input[type=number]{width:82px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#111;font-weight:600;font-size:12px;flex:none}
.fl{flex:1;min-width:0}.mu{color:var(--mu);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--mu);white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.t1{--c:var(--e)}.t2{--c:var(--m)}.t3{--c:var(--h)}
.pb{height:6px;background:var(--p2);border-radius:9px;overflow:hidden;margin:8px 0;min-width:70px}.pb i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.sq{width:18px;height:18px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px #0004,inset -3px -3px #0003}
.done .nm{text-decoration:line-through;opacity:.5}
.note{border:1px dashed var(--m);border-radius:8px;padding:8px 10px;margin:10px 0;color:var(--m)}
.empty{color:var(--mu);text-align:center;padding:22px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chips .btn{padding:4px 11px;border-radius:99px}.chips .on{background:var(--bt);color:var(--bx)}
@media(max-width:820px){.app{grid-template-columns:1fr}
aside{position:fixed;z-index:20;left:0;top:0;width:260px;transform:translateX(-100%);transition:.2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
aside.open{transform:none;box-shadow:0 0 0 100vmax #0008}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--pn);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
main{padding:18px 14px}.g2,.g3{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside id="sb"></aside><div><div class="top"><button class="btn" data-act="menu">☰</button><div class="brand" style="padding:0"><span class="cube"></span>BlockCrew</div></div><main id="app"></main></div></div>
<script>
var CAT=[["Oak Log",1,"#8a6a3b"],["Cobblestone",1,"#8b8b8b"],["Dirt",1,"#7a5232"],["Sand",1,"#e3d7a0"],["Gravel",1,"#9a9391"],["Wheat",1,"#d9c24a"],["Glass",1,"#bfe8f2"],["Coal",2,"#3a3a3a"],["Iron Ingot",2,"#d8d8d8"],["Redstone",2,"#c8281e"],["Gold Ingot",2,"#f2c230"],["Lapis Lazuli",2,"#2a4fbf"],["Copper Ingot",2,"#d9774a"],["Diamond",3,"#4de6e0"],["Obsidian",3,"#3a2a65"],["Emerald",3,"#1fbf5a"],["Ender Pearl",3,"#1f7a6a"],["Blaze Rod",3,"#f09a1a"],["Netherite Scrap",3,"#5a3f3a"]];
var LV=["","Noob","Semi-Pro","Pro"],TN=["","Easy","Medium","Hard"],W=[0,1,2,3],AC=["#f87171","#fb923c","#facc15","#4ade80","#22d3ee","#818cf8","#e879f9"];
var S={players:[],projects:[],view:"overview",open:null,who:null,focus:null};
try{var r=localStorage.getItem("blockcrew");if(r){var d=JSON.parse(r);S.players=d.players||[];S.projects=d.projects||[]}}catch(e){}
if(!S.players.length&&!S.projects.length)S.players=[{id:1,name:"Steve",lvl:3},{id:2,name:"Alex",lvl:2},{id:3,name:"Sam",lvl:1}];
function save(){try{localStorage.setItem("blockcrew",JSON.stringify({players:S.players,projects:S.projects}))}catch(e){}}
function uid(){return Date.now()+Math.floor(Math.random()*1e4)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function color(n){for(var i=0;i<CAT.length;i++)if(CAT[i][0].toLowerCase()==n.toLowerCase())return CAT[i][2];return"#a07040"}
function pill(t){return'<span class="pill t'+t+'">'+TN[t]+'</span>'}
function lp(l){return'<span class="pill t'+l+'">'+LV[l]+'</span>'}
function av(p){return'<span class="av" style="background:'+AC[p.id%7]+'">'+esc(p.name.charAt(0).toUpperCase())+'</span>'}
function sel(id,v){return'<select data-act="lvl" data-id="'+id+'">'+[1,2,3].map(function(l){return'<option value="'+l+'"'+(l==v?" selected":"")+'>'+LV[l]+'</option>'}).join("")+'</select>'}
function prog(j){var t=(j.tasks||[]).length,n=(j.tasks||[]).filter(function(x){return x.done}).length;return t?Math.round(n/t*100):0}
function pts(p,pid){var a=0,b=0;(p.tasks||[]).forEach(function(t){if(t.pid==pid){var w=t.q*W[p.items[t.i].t];a+=w;if(t.done)b+=w}});return[a,b]}
function distribute(p){
  var pl=S.players;p.tasks=[];p.stale=false;if(!pl.length)return;
  var load={};pl.forEach(function(x){load[x.id]=0});var ch=[];
  p.items.forEach(function(it,i){var n=Math.max(1,Math.min(pl.length*2,Math.ceil(it.q/8))),sz=Math.ceil(it.q/n),left=it.q;
    while(left>0){var q=Math.min(sz,left);ch.push({i:i,t:it.t,q:q});left-=q}});
  ch.sort(function(a,b){return b.t-a.t||b.q-a.q});var m={};
  ch.forEach(function(c){var w=c.q*W[c.t],best=null,bs=1e9;
    pl.forEach(function(x){var s=load[x.id]+w+Math.abs(x.lvl-c.t)*w*0.8;if(s<bs){bs=s;best=x}});
    load[best.id]+=w;var k=best.id+"_"+c.i;
    if(m[k])m[k].q+=c.q;else{m[k]={i:c.i,pid:best.id,q:c.q,done:false};p.tasks.push(m[k])}});
}
function side(){
  var h='<div class="brand"><span class="cube"></span>BlockCrew</div><button class="btn p" data-act="newb">+ New Build</button><div class="sec">Platform</div>';
  [["overview","Overview"],["players","Players"],["projects","All builds"]].forEach(function(n){h+='<button class="nv'+(S.view==n[0]?' on':'')+'" data-act="go" data-id="'+n[0]+'">'+n[1]+'</button>'});
  h+='<div class="sec">Builds</div>';
  S.projects.forEach(function(j){h+='<button class="nv'+(S.view=="build"&&S.open==j.id?' on':'')+'" data-act="openb" data-id="'+j.id+'">'+esc(j.name)+'</button>'});
  if(!S.projects.length)h+='<div class="mu" style="padding:4px 10px">No builds yet</div>';
  h+='<div style="flex:1"></div><button class="nv" data-act="theme">◐ Toggle theme</button>';
  document.getElementById("sb").innerHTML=h;
}
function vOver(){
  var tt=0,dn=0;S.projects.forEach(function(j){(j.tasks||[]).forEach(function(t){tt++;if(t.done)dn++})});
  var h='<h1>Overview</h1><div class="sub">Your crew, builds and material progress at a glance.</div><div class="g3"><div class="card"><div class="stat">'+S.players.length+'<small>Players</small></div></div><div class="card"><div class="stat">'+S.projects.length+'<small>Builds</small></div></div><div class="card"><div class="stat">'+(tt?Math.round(dn/tt*100):0)+'%<small>Tasks collected</small></div></div></div>';
  h+='<div class="g2"><div class="card"><h3>Team on duty</h3><div class="sub">Who is carrying the queue right now</div>';
  if(!S.players.length)h+='<div class="empty">Add players first.</div>';
  S.players.forEach(function(p){var o=0;S.projects.forEach(function(j){(j.tasks||[]).forEach(function(t){if(t.pid==p.id&&!t.done)o++})});h+='<div class="row">'+av(p)+'<div class="fl"><b>'+esc(p.name)+'</b><div class="mu">'+o+' open tasks</div></div>'+lp(p.lvl)+'</div>'});
  h+='</div><div class="card"><h3>Skill guide</h3><div class="sub">How materials are matched</div><div class="row">'+lp(1)+'<span class="mu">Easy, common materials</span></div><div class="row">'+lp(2)+'<span class="mu">Moderate materials</span></div><div class="row">'+lp(3)+'<span class="mu">Rare, hardest materials</span></div></div></div>';
  return h+'<div class="card"><h3>Recent builds</h3><div class="sub">Latest projects and progress</div>'+bl()+'</div>';
}
function bl(){
  if(!S.projects.length)return'<div class="empty">No builds yet.</div>';
  return S.projects.slice().reverse().map(function(j){return'<div class="row"><div class="fl"><b>'+esc(j.name)+'</b><div class="mu">'+j.items.length+' materials · '+(j.tasks||[]).length+' tasks</div></div><div style="width:110px"><div class="pb"><i style="width:'+prog(j)+'%"></i></div></div><button class="btn" data-act="openb" data-id="'+j.id+'">Open</button><button class="btn d" data-act="delj" data-id="'+j.id+'">✕</button></div>'}).join("");
}
function vPlayers(){
  var h='<h1>Players</h1><div class="sub">Add, rename and set skill levels. No limit on crew size.</div><div class="card"><h3>Add player</h3><div class="sub">Someone new joined the world?</div><div class="fm"><input type="text" id="pn" placeholder="Player name" maxlength="24"><select id="pl">'+[1,2,3].map(function(l){return'<option value="'+l+'">'+LV[l]+'</option>'}).join("")+'</select><button class="btn p" data-act="addp">Add</button></div></div><div class="card"><h3>Crew ('+S.players.length+')</h3><div class="sub">Edit names directly</div>';
  if(!S.players.length)h+='<div class="empty">No players yet.</div>';
  S.players.forEach(function(p){h+='<div class="row">'+av(p)+'<input class="fl" type="text" value="'+esc(p.name)+'" data-act="ren" data-id="'+p.id+'" maxlength="24">'+sel(p.id,p.lvl)+'<button class="btn d" data-act="delp" data-id="'+p.id+'">✕</button></div>'});
  return h+'</div>';
}
function vList(){
  return'<h1>All builds</h1><div class="sub">Each build has its own materials and tasks.</div><div class="card"><h3>New build</h3><div class="sub">Name your next project</div><div class="fm"><input type="text" id="jn" placeholder="e.g. Castle, Iron Farm" maxlength="40"><button class="btn p" data-act="addj">Create</button></div></div><div class="card">'+bl()+'</div>';
}
function vBuild(p){
  var h='<h1>'+esc(p.name)+'</h1><div class="sub">Materials and fair task assignments.</div><div class="card"><h3>Auto-add from screenshot</h3><div class="sub">Upload your material list screenshot. Materials are read, sorted by difficulty and split among players automatically.</div><div class="fm"><label class="btn" style="flex:1 1 100%;text-align:center"><input type="file" id="shot" accept="image/*" multiple hidden>Choose screenshot</label><button class="btn p" style="flex:1 1 100%" data-act="scan">Read &amp; distribute</button></div><div class="mu" id="fn"></div><textarea id="tx" rows="3" placeholder="Ya list yahan likho ya paste karo, jaise:&#10;Oak Log 128&#10;Diamond 12" style="width:100%;margin-top:8px;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:8px;color:var(--tx);font:inherit"></textarea><div class="mu" id="st">'+esc(S.msg||"")+'</div></div><div class="card"><h3>Materials needed</h3><div class="sub">Pick from the list or type your own</div><div class="fm"><input type="text" id="mn" list="cat" placeholder="Material" data-act="mname"><datalist id="cat">'+CAT.map(function(c){return'<option value="'+c[0]+'">'}).join("")+'</datalist><input type="number" id="mq" min="1" value="64"><select id="mt">'+[1,2,3].map(function(t){return'<option value="'+t+'">'+TN[t]+'</option>'}).join("")+'</select><button class="btn p" data-act="addm">Add</button></div>';
  if(!p.items.length)h+='<div class="empty">No materials yet.</div>';
  p.items.forEach(function(it,i){h+='<div class="row"><span class="sq" style="background:'+color(it.n)+'"></span><span class="fl">'+esc(it.n)+' <span class="mu">×'+it.q+'</span></span>'+pill(it.t)+'<button class="btn d" data-act="delm" data-i="'+i+'">✕</button></div>'});
  h+='</div><div class="card"><h3>Task assignments</h3><div class="sub">Balanced by skill level and workload</div><button class="btn p" data-act="dist">Distribute fairly</button>';
  if(p.stale&&p.items.length)h+='<div class="note">Materials or crew changed. Press Distribute to update.</div>';
  if(p.tasks&&p.tasks.length){
    h+='<div class="pb" style="height:8px;margin-top:14px"><i style="width:'+prog(p)+'%"></i></div><div class="chips"><button class="btn'+(S.who?'':' on')+'" data-act="who" data-id="">All</button>'+S.players.map(function(x){return'<button class="btn'+(S.who==x.id?' on':'')+'" data-act="who" data-id="'+x.id+'">'+esc(x.name)+'</button>'}).join("")+'</div><div class="gc">';
    S.players.forEach(function(x){if(S.who&&S.who!=x.id)return;var a=pts(p,x.id),pc=a[0]?Math.round(a[1]/a[0]*100):0;
      h+='<div class="card" style="margin:0;background:var(--p2)"><div class="row" style="border:0;padding-top:0">'+av(x)+'<div class="fl"><b>'+esc(x.name)+'</b><div class="mu">'+LV[x.lvl]+' · '+a[0]+' pts</div></div></div><div class="pb"><i style="width:'+pc+'%"></i></div>';
      var mine=p.tasks.filter(function(t){return t.pid==x.id});
      if(!mine.length)h+='<div class="mu">Nothing assigned.</div>';
      mine.forEach(function(t){var it=p.items[t.i];h+='<label class="row'+(t.done?' done':'')+'"><input type="checkbox" data-act="done" data-k="'+p.tasks.indexOf(t)+'"'+(t.done?' checked':'')+'><span class="sq" style="background:'+color(it.n)+'"></span><span class="fl nm">'+esc(it.n)+' <span class="mu">×'+t.q+'</span></span>'+pill(it.t)+'</label>'});
      h+='</div>'});
    h+='</div>';
  }
  return h+'</div>';
}
async function scan(p){
  var st=document.getElementById("st"),fs=Array.from(document.getElementById("shot").files);
  if(!fs.length){if(document.getElementById("tx").value.trim())return scanLocal(p,[]);st.textContent="Pehle screenshot choose karo ya list likho.";return}
  if(!S.players.length){st.textContent="Pehle players add karo.";return}
  try{
    var sm=window.claude&&await claude.use("sample");
    if(!sm)return scanLocal(p,fs);
    var lim=await sm.limits();if(!lim.images)return scanLocal(p,fs);
    st.textContent="Reading screenshot...";
    var res=await sm.json("This is a screenshot of a Minecraft material list (e.g. Litematica or a handwritten list). Extract every material. Return ONLY a JSON array of objects {\"n\":English item name in Title Case,\"q\":total quantity as a whole number of items (convert stacks to items, 1 stack = 64 unless stated; use the total required column if there are several),\"t\":difficulty 1|2|3}. Difficulty: 1 = common (logs, planks, stone, cobblestone, dirt, sand, gravel, wool, glass, wheat, sticks); 2 = moderate (iron, coal, redstone, gold, copper, lapis, quartz, slime, bricks, terracotta); 3 = rare/hard (diamond, emerald, netherite, obsidian, ender pearl, blaze rod, nether star, shulker, ancient debris). Skip anything unreadable.",{images:fs.slice(0,lim.images.maxCount||fs.length)});
    var n=0;(Array.isArray(res)?res:[]).forEach(function(x){var q=Math.round(+x.q),nm=String(x.n||"").trim(),t=[1,2,3].indexOf(+x.t)>=0?+x.t:2;if(!nm||!(q>0))return;
      var ex=p.items.filter(function(i){return i.n.toLowerCase()==nm.toLowerCase()})[0];if(ex)ex.q+=q;else p.items.push({n:nm,q:q,t:t});n++});
    if(!n){st.textContent="Koi material nahi mila. Clear screenshot try karo.";return}
    distribute(p);S.msg=n+" materials added aur players me baat diye. Galat ho to delete karke Distribute dubara dabao.";save();render();
  }catch(e){return scanLocal(p,fs)}
}
var HARD=/diamond|emerald|netherite|obsidian|ender|blaze|nether star|shulker|ancient|elytra|beacon|totem|heart of|dragon/i,MED=/iron|coal|redstone|gold|copper|lapis|quartz|brick|terracotta|slime|honey|prismarine|amethyst|glowstone|nether/i;
function tierOf(n){return HARD.test(n)?3:MED.test(n)?2:1}
function lev(a,b){var d=[],i,j;for(i=0;i<=a.length;i++){d[i]=[i]}for(j=0;j<=b.length;j++)d[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function fix(n){var l=n.toLowerCase(),best=null,bd=3;CAT.forEach(function(c){var x=lev(l,c[0].toLowerCase());if(x<bd&&l.length>4){bd=x;best=c}});return best?[best[0],best[1]]:[n.replace(/\b\w/g,function(c){return c.toUpperCase()}),tierOf(n)]}
function parseText(t){var out=[];t.split(/\n/).forEach(function(l){l=l.replace(/[|_\[\]{}()=]/g," ").replace(/\s+/g," ").trim();
  var m=l.match(/^([A-Za-z][A-Za-z' ]*?[A-Za-z])\s*[:\-x]?\s*(\d.*)$/);if(!m)return;var nm=m[1].trim();if(nm.length<3)return;
  var r=m[2],q,k=r.match(/^(\d+)\s*[x×]\s*64\s*\+?\s*(\d+)?/i);
  q=k?(+k[1]*64+(+k[2]||0)):parseInt(r,10);if(!(q>0)||q>100000)return;
  var z=fix(nm);out.push({n:z[0],q:q,t:z[1]})});return out}
function addItems(p,arr){var n=0;arr.forEach(function(x){var ex=p.items.filter(function(i){return i.n.toLowerCase()==x.n.toLowerCase()})[0];if(ex)ex.q+=x.q;else p.items.push({n:x.n,q:x.q,t:x.t});n++});return n}
function prep(file){return new Promise(function(ok){var im=new Image();im.onload=function(){var k=Math.min(2.5,Math.max(1,1800/im.width)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);var d=x.getImageData(0,0,c.width,c.height),a=d.data,s=0,i;for(i=0;i<a.length;i+=4){a[i]=a[i+1]=a[i+2]=.3*a[i]+.59*a[i+1]+.11*a[i+2];s+=a[i]}if(s/(a.length/4)<120)for(i=0;i<a.length;i+=4){a[i]=a[i+1]=a[i+2]=255-a[i]}x.putImageData(d,0,0);c.toBlob(ok)};im.src=URL.createObjectURL(file)})}
async function scanLocal(p,fs){
  var st=document.getElementById("st"),txt=document.getElementById("tx").value;
  try{
    if(fs.length){
      st.textContent="Screenshot padh raha hoon... pehli baar 1 minute lag sakta hai.";
      if(!window.Tesseract)await new Promise(function(ok,no){var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
      var w=await Tesseract.createWorker("eng");
      for(var i=0;i<fs.length;i++){var r=await w.recognize(await prep(fs[i]));txt+="\n"+r.data.text}
      await w.terminate();
    }
    var n=addItems(p,parseText(txt));
    if(!n){st.textContent="Koi material nahi mila. Clear screenshot lo ya neeche list likh do (jaise: Oak Log 128).";return}
    distribute(p);S.msg=n+" materials mile aur players me baat diye. Naam ya number galat ho to ✕ se hata kar sahi wala add karo.";save();render();
  }catch(e){st.textContent="Screenshot nahi padh paya (internet check karo). Neeche list likh kar bhi add kar sakte ho."}
}
function cur(){return S.projects.filter(function(x){return x.id==S.open})[0]}
function render(){
  var p=cur(),v=S.view=="build"&&p?vBuild(p):S.view=="players"?vPlayers():S.view=="projects"?vList():vOver();
  document.getElementById("app").innerHTML=v;side();
  if(S.focus){var f=document.getElementById(S.focus);if(f)f.focus();S.focus=null}
}
function touch(){S.projects.forEach(function(p){if(p.tasks&&p.tasks.length)p.stale=true})}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.dataset.act,id=t.dataset.id,p=cur();
  document.getElementById("sb").classList.remove("open");
  if(a=="menu"){document.getElementById("sb").classList.add("open");return}
  if(a=="theme"){var r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()=="#09090b";r.dataset.theme=dk?"light":"dark";return}
  if(a=="go"){S.view=id}
  else if(a=="newb"){S.view="projects";S.focus="jn"}
  else if(a=="openb"){S.view="build";S.open=+id;S.who=null}
  else if(a=="addp"){var n=document.getElementById("pn").value.trim();if(!n)return;S.players.push({id:uid(),name:n,lvl:+document.getElementById("pl").value});touch()}
  else if(a=="delp"){S.players=S.players.filter(function(x){return x.id!=id});S.projects.forEach(function(j){if(j.tasks&&j.tasks.length){j.tasks=j.tasks.filter(function(k){return k.pid!=id});j.stale=true}})}
  else if(a=="addj"){var n2=document.getElementById("jn").value.trim();if(!n2)return;var j={id:uid(),name:n2,items:[],tasks:[]};S.projects.push(j);S.open=j.id;S.view="build"}
  else if(a=="delj"){S.projects=S.projects.filter(function(x){return x.id!=id});if(S.open==id){S.open=null;S.view="projects"}}
  else if(a=="addm"&&p){var n3=document.getElementById("mn").value.trim(),q=Math.max(1,+document.getElementById("mq").value||1);if(!n3)return;p.items.push({n:n3,q:q,t:+document.getElementById("mt").value});p.stale=true;p.tasks=[]}
  else if(a=="delm"&&p){p.items.splice(+t.dataset.i,1);p.stale=true;p.tasks=[]}
  else if(a=="dist"&&p)distribute(p);
  else if(a=="scan"&&p){scan(p);return}
  else if(a=="who")S.who=id?+id:null;
  else if(a=="done"&&p)p.tasks[+t.dataset.k].done=t.checked;
  else return;
  save();render();
});
document.addEventListener("change",function(e){
  var t=e.target,a=t.dataset.act;
  if(t.id=="shot"){document.getElementById("fn").textContent=Array.from(t.files).map(function(f){return f.name}).join(", ")}
  else if(a=="lvl"){S.players.forEach(function(x){if(x.id==t.dataset.id)x.lvl=+t.value});touch();save();render()}
  else if(a=="ren"){var v=t.value.trim();if(v){S.players.forEach(function(x){if(x.id==t.dataset.id)x.name=v});save();render()}}
});
document.addEventListener("input",function(e){
  if(e.target.dataset.act=="mname"){var v=e.target.value.toLowerCase();CAT.forEach(function(c){if(c[0].toLowerCase()==v)document.getElementById("mt").value=c[1]})}
});
render();
